server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Service worker, its registration script and the app shell must never be
  # cached by the browser or a proxy: a stale sw.js pins every scout's phone
  # to the old app version, and fixes can't reach them mid-event.
  location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|push-handler\.js|index\.html|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Vite content-hashes everything under /assets: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # A missing static file is a real 404, not the HTML shell with a 200.
  location ~* \.(png|jpe?g|gif|svg|ico|webp|woff2?|ttf|json|txt|map)$ {
    try_files $uri =404;
  }

  # Client-side routes (/scout-form, /game-start, ...) all serve the SPA shell.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
